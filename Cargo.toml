[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["actix-example", "axum-example"]

[workspace.dependencies]
insta = { version = "1.48", features = ["yaml", "redactions"] }
anyhow = { version = "1.0" }
actix-web = "4.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
http = "1"
mime = "0.3"
